auth_enabled: false

server:
  http_listen_port: 3100

ingester:
  wal:
    dir: /var/loki/wal
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 2h
  chunk_retain_period: 24h

schema_config:
  configs:
    - from: 2025-04-29
      store: boltdb
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb:
    directory: /var/loki/index
  filesystem:
    directory: /var/loki/

compactor:
  working_directory: /var/loki/compactor

limits_config:
  allow_structured_metadata: false
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 15
  reject_old_samples: true
